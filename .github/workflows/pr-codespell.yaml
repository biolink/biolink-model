name: Codespell

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    types: trigger-codespell

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Runs the locked codespell from the dev group (no Docker Hub pull), configured by
      # [tool.codespell] in pyproject.toml — the same check `make test` runs locally.
      - name: Install codespell
        run: uv sync --locked --only-dev

      - name: Codespell
        run: uv run --no-sync codespell
