name: Regenerate Biolink Model Artifacts

# Controls when the action will run. Triggers the workflow on push
# event but only for the master branch, and specifically on the biolink-model.yaml
on:
  push:
    branches:
      - master
  workflow_dispatch:
    types: trigger-build-artifacts

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl

      - name: Install dependencies
        # gen-project / id-prefixes / make test all need the linkml generators from `scripts`.
        run: uv sync --extra scripts

      - name: Generate Biolink Model artifacts
        run: |
          make gen-project
          make id-prefixes
          make test

      - name: Commit and push the regenerated artifacts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add project/* src/*
          if git diff --cached --quiet; then
            echo "Artifacts are already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate artifacts from biolink-model.yaml"
          git push
