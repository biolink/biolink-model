name: Audit dependencies

env:
  UV_PREVIEW: "1"          # Enable preview uv audit/malware engines
  UV_MALWARE_CHECK: "1"    # Block malicious installs on sync/run
  UV_EXCLUDE_NEWER: "7 days"  # Mirror pyproject.toml cooldown

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  security-check:
    name: Validate Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Unpinned: audit/malware-check are preview-only and ship in recent uv releases.
      - name: Install uv and setup uv caching
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        id: setup-python
        with:
          python-version: 3.13

      # Check the lockfile for known CVEs.
      #
      # The --ignore flags below suppress advisories that cannot be fixed while
      # the project supports Python < 3.11.5 (requires-python >= 3.10): the fixed
      # releases of soupsieve (>= 3.0.2 / 4.0.0) and dnspython (>= 2.9.0) require
      # Python >= 3.11.5 / >= 3.11, so uv.lock must keep an older, vulnerable
      # fork of each package for the old-Python resolution. Environments on
      # Python >= 3.11.5 (including this job and the regular CI builds) resolve
      # to the fixed versions. All four advisories are CPU-exhaustion/DoS issues
      # in dev-only tooling (docs build via mkdocs-mermaid2-plugin/beautifulsoup4,
      # schemasheets via bioregistry), not runtime dependencies of the published
      # package. Remove these ignores when requires-python moves to >= 3.11.5.
      - name: Audit lockfile for CVEs
        run: |
          uv audit \
            --ignore GHSA-mmhr-3c5m-f64f \
            --ignore GHSA-7g44-g9rc-x53w \
            --ignore GHSA-6655-6qjp-jx7x \
            --ignore GHSA-45c3-73f7-pv4m

      # Anti-malware gate: a sync against a package with a known OSV malware
      # advisory exits non-zero. The advisory-publication gap is covered by the
      # 7-day exclude-newer cooldown.
      - name: Verify Environment Sync (Anti-Malware Gate)
        run: uv sync --frozen
