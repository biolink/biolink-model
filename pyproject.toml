[project]
name = "biolink-model"
dynamic = ["version"]
description = "The Biolink Model is a high-level data model designed to standardize types and relationships in biological knowledgebases."
authors = [
    {name = "Chris Mungall", email = "cjm@berkeleybop.org"},
    {name = "Deepak Unni", email = "deepak.unni3@gmail.com"},
    {name = "Sierra Moxon", email = "smoxon@lbl.gov"},
    {name = "Richard Bruskiewich", email = "richard@delphinai.ca"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2,<3",
    # DO NOT MERGE branch: relaxed from ==1.11.1 so downstream projects testing
    # these artifacts resolve whatever linkml-runtime they already use. Only
    # datamodel/model.py and the dev scripts import it; datamodel/pydanticmodel_v2.py
    # -- the module downstream actually imports -- needs nothing but pydantic.
    # Floor matches linkml's own declaration (>=1.10,<2) and is verified: both
    # datamodel modules import cleanly against 1.10.0, which is what
    # translator-ingests resolves today. A >=1.11 floor fought that lock.
    "linkml-runtime>=1.10,<2",
]

[project.scripts]
generate_viz_json = "biolink_model.scripts.generate_json:generate_viz_json"

[project.optional-dependencies]
scripts = [
    "linkml==1.12.0rc1",
    "rdflib",
    "curies",
]
docs = [
    # Must cover everything mkdocs.yml declares: `theme: material` and `plugins: [search, mermaid2]`.
    # Bounds mirror the dev group so a standalone `pip install biolink-model[docs]` builds the same
    # site CI builds.
    "mkdocs>=1.4.2,<2",
    "mkdocs-material>=9.5.17,<10",
    "mkdocs-mermaid2-plugin>=1.1.1,<2",
]
all = [
    "biolink-model[scripts,docs]",
]

[dependency-groups]
dev = [
    # DO NOT MERGE branch: both pinned to the RC so `make gen-project` reproduces
    # the committed artifacts exactly. linkml 1.12.0rc1 only requires
    # linkml-runtime>=1.10,<2, so without the runtime pin here generation would
    # run against the 1.11.1 runtime and produce a mismatched pair.
    "linkml==1.12.0rc1",
    "linkml-runtime==1.12.0rc1",
    "mkdocs>=1.4.2,<2",
    "mkdocs-material>=9.5.17,<10",
    "mkdocs-mermaid2-plugin>=1.1.1,<2",
    "schemasheets>=0.2.1,<0.5",
    "codespell>=2.2.6,<3",
    "pytest>=8.1.1,<10",
    "yamllint>=1.35.1,<2",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/biolink_model"]

[tool.uv]
# Dependency cooldown: ignore releases newer than 7 days so malware/CVE advisories have time to surface.
# uv records this as `exclude-newer-span = "P7D"` in uv.lock (and may also include a placeholder
# `exclude-newer` timestamp for backwards compatibility), avoiding per-relock absolute timestamps and
# reducing cross-branch merge conflicts (see astral-sh/uv#18708). Requires uv >= 0.9.17.
exclude-newer = "7 days"
# DO NOT MERGE branch: linkml 1.12.0rc1 was published 2026-10-02 and is still inside
# the cooldown window, which makes `uv lock` unsatisfiable. Overridden for these two
# packages only, so the cooldown still protects every other dependency.
exclude-newer-package = { linkml = "2026-10-03T00:00:00Z", linkml-runtime = "2026-10-03T00:00:00Z" }

[tool.codespell]
skip = '.idea,.git,SEMMEDDB*,semmed*,*.svg,docs,./src/docs/registry.md,./.venv'
ignore-words-list = 'amination,ehr,mor,brite,nin,mirgate'
